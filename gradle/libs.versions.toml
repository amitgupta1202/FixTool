[versions]
androidx-lifecycle = "2.10.0"
composeHotReload = "1.1.1"
composeMultiplatform = "1.9.3"
detekt = "1.23.8"
# Pinned to 3.70 (not latest 3.73): 3.70 is the newest JediTerm built with Kotlin 2.1.x, so its
# module metadata is readable by this project's Kotlin 2.2.21 compiler and it needs only stdlib
# 2.1.21. 3.73 jumped to Kotlin 2.4.0 metadata, which the 2.2.21 compiler refuses to read.
jediterm = "3.70"
junit = "4.13.2"
kotlin = "2.2.21"
pty4j = "0.13.10"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.9.0"
filekit = "0.12.0"
ktlint = "12.1.2"
logback = "1.5.34"
quickfixj = "2.3.2"
testRetry = "1.6.2"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlin-scripting-jsr223 = { module = "org.jetbrains.kotlin:kotlin-scripting-jsr223", version.ref = "kotlin" }
kotlin-script-runtime = { module = "org.jetbrains.kotlin:kotlin-script-runtime", version.ref = "kotlin" }
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
filekit-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekit" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
quickfixj-core = { module = "org.quickfixj:quickfixj-core", version.ref = "quickfixj" }
quickfixj-messages-all = { module = "org.quickfixj:quickfixj-messages-all", version.ref = "quickfixj" }
# Embedded terminal (IntelliJ-style): JediTerm renderer + pty4j PTY backend
jediterm-core = { module = "org.jetbrains.jediterm:jediterm-core", version.ref = "jediterm" }
jediterm-ui = { module = "org.jetbrains.jediterm:jediterm-ui", version.ref = "jediterm" }
pty4j = { module = "org.jetbrains.pty4j:pty4j", version.ref = "pty4j" }

[plugins]
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
testRetry = { id = "org.gradle.test-retry", version.ref = "testRetry" }